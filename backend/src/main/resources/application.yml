spring:
  application:
    name: housing-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/housing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8

payment:
  mock:
    signature-secret: trae-pay-secret-2026
    force-success: true

trae:
  app:
    cors:
      origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    recommendation:
      active-model-version: ${RECOMMENDATION_ACTIVE_MODEL_VERSION:}
    password-reset:
      code-expire-minutes: 10
      debug-return-code: true
